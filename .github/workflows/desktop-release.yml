name: macOS app release

# Builds SafeRedact for Apple Silicon and Intel and attaches the DMGs to a
# draft GitHub release. Push a tag like v1.2.0 or run it manually.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The app is ad-hoc signed by default. To sign and notarize with a paid
      # Apple Developer account, add these repository secrets and pass them
      # in the env block below:
      #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: SafeRedact ${{ github.ref_name }}
          releaseDraft: true
          args: --target ${{ matrix.target }} --bundles dmg

      # Manual runs without a tag don't create a release; keep the DMG as an artifact
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: SafeRedact-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
