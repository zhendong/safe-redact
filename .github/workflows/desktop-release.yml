name: macOS app release

# Builds SafeRedact for Apple Silicon and Intel and attaches the DMGs to a
# draft GitHub release. Push a tag like v1.2.0 or run it manually.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            tauri-args: ''
          # Native Intel runner so the checks below run on x86_64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            tauri-args: --config src-tauri/tauri.intel.conf.json
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # ONNX Runtime stopped publishing x86_64 macOS binaries after 1.23.2, and
      # ort-sys has none for Intel. Link Microsoft's 1.23.2 dylib dynamically and
      # bundle it (tauri.intel.conf.json); ort is capped at API 23 to match.
      - name: Fetch ONNX Runtime 1.23.2 (Intel)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          curl -sSLf -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-osx-x86_64-1.23.2.tgz
          echo "d10359e16347b57d9959f7e80a225a5b4a66ed7d7e007274a15cae86836485a6  ort.tgz" | shasum -a 256 -c
          tar xzf ort.tgz
          mv onnxruntime-osx-x86_64-1.23.2 src-tauri/onnxruntime
          echo "ORT_LIB_PATH=$PWD/src-tauri/onnxruntime/lib" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"

      # Run the NER model with the ONNX Runtime this build links
      - name: Test native NER
        run: |
          npm run desktop:assets
          DYLD_LIBRARY_PATH="${ORT_LIB_PATH:-}" cargo test --release --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml ner::

      # The app is ad-hoc signed by default. To sign and notarize with a paid
      # Apple Developer account, add these repository secrets and pass them
      # in the env block below:
      #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: SafeRedact ${{ github.ref_name }}
          releaseDraft: true
          args: --target ${{ matrix.target }} --bundles dmg ${{ matrix.tauri-args }}

      # Launch the app from the DMG to catch dylibs that are missing or rejected
      # by the code signature
      - name: Check the app launches
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/saferedact src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          /tmp/saferedact/SafeRedact.app/Contents/MacOS/SafeRedact > launch.log 2>&1 &
          pid=$!
          sleep 15
          cat launch.log
          kill -0 $pid
          kill $pid

      # Manual runs without a tag don't create a release; keep the DMG as an artifact
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: SafeRedact-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
