[package]
name = "safe-redact"
version = "1.1.0"
description = "A privacy-focused tool that redacts sensitive information from PDF, DOCX, and image files"
authors = ["zhendong"]
license = "MIT"
repository = "https://github.com/zhendong/safe-redact"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "safe_redact_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
ort = "=2.0.0-rc.14"
tauri-plugin-log = "2"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Stripping proc-macro dylibs breaks loading them on recent macOS
# ("mis-aligned LINKEDIT string pool"); only strip the shipped app
[profile.release.build-override]
strip = false
